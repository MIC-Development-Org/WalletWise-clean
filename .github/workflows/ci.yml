name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # A real database, so the API integration tests run in CI exactly as they do locally.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: money
          POSTGRES_PASSWORD: money
          POSTGRES_DB: money_tracker_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U money"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://money:money@localhost:5432/money_tracker_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @money-tracker/api exec prisma generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

  android:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @money-tracker/web build
      - run: pnpm --filter @money-tracker/android exec cap sync android
      - run: ./gradlew assembleDebug
        working-directory: apps/android/android
