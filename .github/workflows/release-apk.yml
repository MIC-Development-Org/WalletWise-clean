name: Release Android APK

# Pushing a tag like v0.1.0 builds the web app, wraps it with Capacitor, builds the APK and
# attaches it to a GitHub Release as walletwise.apk. The site links to /downloads/walletwise.apk,
# so publish that file next to the web build (see infra/) or point VITE_APK_URL at the release asset.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm --filter @money-tracker/web build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Sync into the Android project
        run: pnpm --filter @money-tracker/android sync

      - name: Build APK
        working-directory: apps/android/android
        run: ./gradlew assembleDebug

      - name: Name the file
        run: cp apps/android/android/app/build/outputs/apk/debug/app-debug.apk walletwise.apk

      - uses: actions/upload-artifact@v4
        with:
          name: walletwise-apk
          path: walletwise.apk

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: walletwise.apk
